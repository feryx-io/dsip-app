[workspace]
resolver = "2"
members = ["crates/dsip-app", "app/rust"]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thevoiceguy/dsip-app"

[workspace.dependencies]
# dsip-rs, every crate at one ref (dsip-rs RELEASING.md, "Downstream"): the release tag
dsip-core = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-endpoint = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-media = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-phone = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-transport = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-messenger = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-messaging-device = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06", features = ["sqlite"] }
dsip-mls = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06", features = ["sqlite"] }
dsip-mailbox = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-messaging = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
dsip-testkit = { git = "https://github.com/thevoiceguy/dsip-rs", tag = "v2026.11.06" }
# Anvil's audio and updater (app plan decision 4 (a)): cpal, echo cancellation; the signed manifest, installed the way
# this copy was. Every Anvil crate at one ref.
# TEMPORARY: anvil PR #66 (anvil-update for other apps) until its tag v0.2.32.
anvil-audio = { git = "https://github.com/thevoiceguy/anvil", rev = "e13c3f7d7e41201ac95eb750f5e76f5546b57274", features = ["tone"] }
anvil-core = { git = "https://github.com/thevoiceguy/anvil", rev = "e13c3f7d7e41201ac95eb750f5e76f5546b57274", default-features = false }
anvil-update = { git = "https://github.com/thevoiceguy/anvil", rev = "e13c3f7d7e41201ac95eb750f5e76f5546b57274" }
