name: app

# The app (app/): analysed and its widget tests run; its golden screenshots compared on all three desktops; its
# bindings held to the Rust API; built for Linux, Windows and macOS, and its integration test run on each with its Rust
# core loaded; built for Android and iOS, and its mobile integration test run in an emulator and a simulator (A5, as
# Anvil's U4a).

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FLUTTER_VERSION: "3.47.6"
  FRB_VERSION: "2.13.0"
  # the Opus source vendored by audiopus_sys (ci.yml says the same)
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  checks:
    name: analyze, widget tests, bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # the widget tests, and the goldens made on Linux matched exactly
      - run: flutter test
      - name: What differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-linux
          path: app/test/goldens/failures
          if-no-files-found: ignore
      - name: Rust, as pinned in rust-toolchain.toml
        working-directory: .
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@v2
      - name: The generator
        working-directory: .
        run: |
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -q "$FRB_VERSION"; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          fi
      - name: The bindings match the Rust API
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libasound2-dev
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, target: linux }
          - { name: Windows, os: windows-latest, target: windows }
          - { name: macOS, os: macos-latest, target: macos }
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL's build from source gets a full Perl (ci.yml says why)
        if: matrix.target == 'windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust, as pinned in rust-toolchain.toml
        working-directory: .
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Linux build tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev xvfb
      - run: flutter pub get
      # one set of goldens, made on Linux, holds here too (test/goldens/tolerant_comparator.dart)
      - name: The screens look the same as on Linux
        if: matrix.target != 'linux'
        run: flutter test test/goldens
      - name: What differed
        if: failure() && matrix.target != 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.target }}
          path: app/test/goldens/failures
          if-no-files-found: ignore
      - run: flutter build ${{ matrix.target }} --release
      - name: The app starts with its Rust core
        timeout-minutes: 30
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            xvfb-run -a flutter test integration_test/app_test.dart -d linux
          else
            flutter test integration_test/app_test.dart -d ${{ matrix.target }}
          fi

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Three ABIs of the Rust core, then an emulator: more than the runner's free disk without what Android does not
      # need.
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust, as pinned in rust-toolchain.toml, for Android
        working-directory: .
        run: |
          rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - run: flutter pub get
      # Signed with the app's one key (repository secrets), so each APK installs over the last and keeps its data;
      # where the secrets are not given (a fork's pull request), the debug key.
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.DSIP_ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.DSIP_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "no signing key: the debug key"; exit 0; fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/dsip.p12"
          {
            echo "DSIP_ANDROID_KEYSTORE=$RUNNER_TEMP/dsip.p12"
            echo "DSIP_ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"
      # Phones (arm64, older arm) and the emulator (x86_64); 32-bit x86 is only old emulators. Waking (A5d) through
      # the push gateway on L2 and the Firebase project feryx-disp: its values from repository secrets (what
      # google-services.json holds); without them (a fork's pull request) the app builds with push off.
      - run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
        env:
          DSIP_PUSH_GATEWAY: did:web:172-238-48-78.ip.linodeusercontent.com%3A8445
          DSIP_FCM_APP_ID: ${{ secrets.DSIP_FCM_APP_ID }}
          DSIP_FCM_SENDER_ID: ${{ secrets.DSIP_FCM_SENDER_ID }}
          DSIP_FCM_API_KEY: ${{ secrets.DSIP_FCM_API_KEY }}
          DSIP_FCM_PROJECT_ID: ${{ secrets.DSIP_FCM_PROJECT_ID }}
      - name: Signed with the app's key
        if: env.DSIP_ANDROID_KEYSTORE != ''
        run: |
          signer=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: ${signer:-none found}"
          out=$("$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1) || true
          got=$(printf '%s\n' "$out" | grep -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' | head -1 | awk '{print $NF}')
          want=$(cat android/signing-cert.sha256)
          echo "signed by ${got:-nothing found}"
          [ "$got" = "$want" ] || { printf '%s\n' "$out"; echo "expected $want"; exit 1; }
          rm -f "$RUNNER_TEMP/dsip.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: dsip-app-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # The emulator's debug build needs only its own ABI; the release build's go.
      - run: rm -rf build
      - name: The emulator may use KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app starts with its Rust core on a phone
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: app
          script: tool/android_test.sh
      - name: The emulator's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-logcat
          path: app/logcat.txt
          if-no-files-found: ignore

  ios:
    name: iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust, as pinned in rust-toolchain.toml, for iOS
        working-directory: .
        run: |
          rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - run: flutter pub get
      # Unsigned until there is an Apple Developer account (A4c, A7).
      - name: flutter build ios --release --no-codesign
        # Flutter hides Xcode's errors behind a generic message; the verbose log has them.
        run: |
          if ! flutter build ios --release --no-codesign -v > ios-build.log 2>&1; then
            # Cargokit's own lines (the Rust build), then Xcode's errors.
            grep "SEVERE" ios-build.log | grep -vE "Compiling|Downloaded|Checking" | head -200
            grep -nE "error:|\*\* BUILD FAILED" ios-build.log | head -40
            exit 1
          fi
      - name: The iOS build's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: app/ios-build.log
          if-no-files-found: ignore
      - name: A simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator")')
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: The test app, built for the simulator
        # Xcode builds the Rust core for the simulator from scratch here (its build folder is not the cache's): built
        # apart from the run, so the run below rebuilds nothing.
        timeout-minutes: 60
        run: flutter build ios --simulator --debug -t integration_test/mobile_test.dart
      - name: The app starts with its Rust core on a phone
        # Now and then the run hangs once the app is built, before any test (Anvil found it): each try gets ten
        # minutes, on a simulator booted again, three tries.
        timeout-minutes: 40
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          for attempt in 1 2 3; do
            xcrun simctl spawn "$UDID" log stream --level debug \
              --predicate 'process == "Runner"' >> simulator.log 2>&1 &
            flutter test integration_test/mobile_test.dart -d "$UDID" &
            test=$!
            ( sleep 600; touch hung; echo "::warning::try $attempt hung"
              kill -TERM "$test"; sleep 10; kill -KILL "$test" ) 2>/dev/null &
            watchdog=$!
            wait "$test" && status=0 || status=$?
            kill "$watchdog" 2>/dev/null || true
            # Passed, or ran and failed: that is the job's answer. Only a hang is tried again.
            if [ ! -e hung ]; then exit "$status"; fi
            rm hung
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
          done
          exit 1
      - name: The simulator's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-log
          path: app/simulator.log
          if-no-files-found: ignore
