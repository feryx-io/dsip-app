name: release

# A tag vX.Y.Z (the dsip-app crate's version) builds and publishes a GitHub release (app plan A4; Anvil's release.yml
# is the model): the desktop app's installers (a Windows setup, a macOS disk image, a Linux .deb and AppImage), each
# installed, started and removed again before anything is published, and the `dsip-app` CLI for each desktop, with
# SHA256SUMS over the lot, and latest.json with its Ed25519 signature for the app's updater (app/rust/src/api/update.rs).
# Nothing is code-signed yet: Windows and macOS warn before the first run.
#
# A pull request that changes this file or the packaging builds and checks everything the same way without publishing
# it (the files are the run's artifacts), so the pipeline is proved before a tag needs it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/packaging/**"
      - "app/linux/packaging/**"
      - "app/tool/icons.py"
      - "app/rust/src/api/update.rs"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"
  # the Opus source vendored by audiopus_sys (ci.yml says the same)
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/dsip-app/Cargo.toml | head -1)
          [ -n "$version" ] || { echo "::error::no version in crates/dsip-app/Cargo.toml"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME is not the dsip-app crate's version v$version"
              exit 1
            fi
            label=$GITHUB_REF_NAME
          else
            label=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  cli:
    name: dsip-app (the CLI) for ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, platform: linux-x86_64 }
          - { name: macOS, os: macos-latest, platform: macos-aarch64 }
          - { name: Windows, os: windows-latest, platform: windows-x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL's build from source gets a full Perl (ci.yml says why)
        if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - name: Rust, as pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - run: cargo build --release --locked -p dsip-app --bin dsip-app
      - name: Package
        run: |
          name="dsip-app-${{ needs.version.outputs.label }}-${{ matrix.platform }}"
          mkdir -p "$name" dist
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/dsip-app.exe "$name/"
            # the Visual C++ runtime beside the exe, so nothing else needs installing
            for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$dll" "$name/"; done
            "$name/dsip-app.exe" --version
            7z a -tzip "dist/$name.zip" "$name" > /dev/null
          else
            cp target/release/dsip-app "$name/"
            "$name/dsip-app" --version
            tar czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.platform }}
          path: dist/

  app-linux:
    name: The app for Linux
    needs: version
    runs-on: ubuntu-latest
    env:
      APPIMAGETOOL: ${{ github.workspace }}/appimagetool
      APPIMAGE_RUNTIME: ${{ github.workspace }}/runtime-x86_64
      # appimagetool is itself an AppImage; runners have no FUSE
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust, as pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev xvfb
      # pinned by digest: appimagetool 1.9.1 and the type2 runtime 20251108 (as Anvil's)
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c <<SUMS
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          SUMS
          chmod +x appimagetool
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release --build-name ${{ needs.version.outputs.version }} --build-number ${{ github.run_number }}
      - name: Package
        run: app/packaging/linux.sh ${{ needs.version.outputs.version }} ${{ needs.version.outputs.label }} app/build/linux/x64/release/bundle dist
      # installed as a user would, started (still running ten seconds later: timeout's 124), removed
      - name: The .deb installs, starts and goes
        run: |
          sudo apt-get install -y ./dist/dsip_*_amd64.deb
          test -x /opt/dsip/dsip && command -v dsip
          test -f /usr/share/applications/com.thevoiceguy.dsip.desktop
          ! ldd /opt/dsip/dsip /opt/dsip/lib/*.so | grep "not found"
          set +e; xvfb-run -a timeout 10 dsip; code=$?; set -e
          [ "$code" = 124 ] || { echo "::error::dsip exited with $code"; exit 1; }
          sudo apt-get remove -y dsip
          test ! -e /opt/dsip/dsip
      - name: The AppImage starts
        run: |
          chmod +x dist/DSIP-*.AppImage
          set +e; xvfb-run -a timeout 10 dist/DSIP-*.AppImage; code=$?; set -e
          [ "$code" = 124 ] || { echo "::error::the AppImage exited with $code"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-linux
          path: dist/

  app-windows:
    name: The app for Windows
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL's build from source gets a full Perl (ci.yml says why)
        run: Add-Content $env:GITHUB_ENV 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust, as pinned in rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --build-name ${{ needs.version.outputs.version }} --build-number ${{ github.run_number }}
      # Flutter's Windows apps need the Visual C++ runtime; it goes beside the exe, so nothing else needs installing
      - name: The C++ runtime beside the app
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" app/build/windows/x64/runner/Release/
          }
      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$iscc\ISCC.exe")) { choco install innosetup -y --no-progress }
            "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: Package
        working-directory: app/packaging
        run: |
          iscc /Q "/DVersion=${{ needs.version.outputs.version }}" "/DLabel=${{ needs.version.outputs.label }}" `
            "/DBundle=$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release" "/DOut=$env:GITHUB_WORKSPACE\dist" windows.iss
          Get-ChildItem $env:GITHUB_WORKSPACE\dist
      # installed silently for this user, started (still running ten seconds later), stopped, uninstalled silently:
      # the program goes, the identity's folder stays
      - name: The installer installs, starts and goes, and keeps the identity
        run: |
          $setup = Get-ChildItem dist/DSIP-*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\DSIP"
          if (-not (Test-Path "$dir\dsip.exe")) { throw "dsip.exe is not installed" }
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'DSIP.lnk'
          if (-not (Test-Path $menu)) { throw "no Start menu entry ($menu)" }
          $p = Start-Process "$dir\dsip.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "dsip.exe exited with $($p.ExitCode)" }
          $data = "$env:APPDATA\com.thevoiceguy.dsip\DSIP"
          if (-not (Test-Path $data)) { throw "the app made no folder where the uninstaller looks ($data)" }
          Set-Content "$data\marker" 'an identity'
          $p | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\dsip.exe") { throw "the uninstaller left dsip.exe" }
          if (Test-Path $menu) { throw "the uninstaller left the Start menu entry" }
          if (-not (Test-Path "$data\marker")) { throw "a silent uninstall deleted the identity's folder" }
      # an update over the running app, as the app starts one (anvil-update): the setup waits for the app to go, runs
      # silently, and starts it again (waited for as one process: `Start-Process -Wait` would wait for the app too)
      - name: An update installs over the running app and starts it again
        run: |
          $setup = (Get-ChildItem dist/DSIP-*-setup.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\DSIP"
          $p = Start-Process "$dir\dsip.exe" -PassThru
          Start-Sleep -Seconds 5
          $wait = "Wait-Process -Id $($p.Id) -Timeout 30; Stop-Process -Id $($p.Id) -Force; " +
                  "(Start-Process -PassThru -FilePath '$setup' -ArgumentList " +
                  "'/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/relaunch=1').WaitForExit()"
          $updater = Start-Process powershell.exe -ArgumentList '-NoProfile', '-NonInteractive', '-Command', $wait -PassThru
          Start-Sleep -Seconds 3
          Stop-Process -Id $p.Id -Force   # the app quitting for the update
          if (-not $updater.WaitForExit(180000)) { throw "the update did not finish" }
          Start-Sleep -Seconds 10
          $again = Get-Process dsip -ErrorAction SilentlyContinue
          if (-not $again) { throw "the app was not started again after the update" }
          $again | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-windows
          path: dist/

  app-macos:
    name: The app for macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust, as pinned in rust-toolchain.toml, for Apple Silicon and Intel
        run: |
          rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release --build-name ${{ needs.version.outputs.version }} --build-number ${{ github.run_number }}
      - name: Package
        run: app/packaging/macos.sh ${{ needs.version.outputs.label }} app/build/macos/Build/Products/Release/DSIP.app dist
      - name: The disk image holds the app, and it starts
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "$mnt" dist/DSIP-*-macos.dmg
          app="$mnt/DSIP.app"
          test -L "$mnt/Applications"
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$v" = "${{ needs.version.outputs.version }}" ] || { echo "::error::version $v"; exit 1; }
          archs=$(lipo -archs "$app/Contents/MacOS/DSIP"); echo "$archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "::error::not universal: $archs"; exit 1; }
          codesign --verify --deep "$app"
          cp -R "$app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          "$RUNNER_TEMP/DSIP.app/Contents/MacOS/DSIP" & pid=$!
          sleep 10
          kill -0 $pid || { echo "::error::the app exited"; exit 1; }
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-macos
          path: dist/

  publish:
    name: Publish the release
    needs: [version, cli, app-linux, app-windows, app-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # Signed with the DSIP_UPDATE_KEY secret whenever the run has it (a tag, a pull request from this repository),
      # and checked against the public key the app carries, so a secret that does not match it fails before a tag
      # does; a run without it (a fork) signs with a key of its own, to prove the steps. A tag needs the secret.
      - name: The update manifest, signed
        env:
          UPDATE_KEY: ${{ secrets.DSIP_UPDATE_KEY }}
        run: |
          app/packaging/manifest.py ${{ needs.version.outputs.version }} "${{ needs.version.outputs.label }}" "$GITHUB_REPOSITORY" dist
          key=$(mktemp)
          if [ -n "$UPDATE_KEY" ]; then
            printf '%s\n' "$UPDATE_KEY" > "$key"
            public=app/packaging/update-key.pub.pem
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::the DSIP_UPDATE_KEY secret is not set"
            exit 1
          else
            echo "::warning::no DSIP_UPDATE_KEY here: signed with a throwaway key"
            openssl genpkey -algorithm ed25519 -out "$key"
            public=$(mktemp)
            openssl pkey -in "$key" -pubout -out "$public"
          fi
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/latest.json -out dist/latest.json.sig
          rm -f "$key"
          openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in dist/latest.json -sigfile dist/latest.json.sig
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "DSIP $GITHUB_REF_NAME" --notes-file - <<NOTES
          The DSIP desktop app for Windows, macOS and Linux, and the \`dsip-app\` CLI.

          - **Windows**: \`DSIP-$GITHUB_REF_NAME-windows-x86_64-setup.exe\` installs for you alone, no administrator needed.
          - **macOS**: open \`DSIP-$GITHUB_REF_NAME-macos.dmg\` and drag DSIP to Applications (Apple Silicon and Intel).
          - **Linux**: \`dsip_${GITHUB_REF_NAME}_amd64.deb\` for Debian and Ubuntu, or \`DSIP-$GITHUB_REF_NAME-x86_64.AppImage\` to run in place.
          - **dsip-app**, the client without a window, driven from the command line: \`dsip-app-$GITHUB_REF_NAME-<platform>\`.

          The app looks for new releases and updates itself (the Windows setup, an AppImage); a .deb, or a Mac app in a
          folder you cannot write, is told of the release and given the file. Your identity's keys live in the app's folder; uninstalling keeps them unless you say otherwise. Nothing is
          code-signed yet (it will be once there are certificates), so the first run warns: on Windows, SmartScreen's "More
          info" → "Run anyway"; on macOS, open DSIP once, then System Settings → Privacy & Security → "Open Anyway"
          (before macOS 15, right-click → Open). An update the Windows app installs itself does not ask again. Check downloads against
          \`SHA256SUMS\`.
          NOTES
