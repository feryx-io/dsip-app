# The Rust every build of dsip-app uses, locally and in CI (the workflow installs from this file), the same as
# dsip-rs's. Clippy runs with `-D warnings` in CI, so a new Rust release brings new lints: bump the version here,
# deliberately, and clear what it finds in the same change.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
